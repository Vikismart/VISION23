<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0e17"/>

  <!-- Radial Glow Behind Iris -->
  <circle cx="256" cy="256" r="180" fill="url(#cyberGlow)"/>

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#neonAccent)" stroke-width="6"/>

  <!-- HUD Crosshair Reticles -->
  <line x1="256" y1="20" x2="256" y2="60" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="452" x2="256" y2="492" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="256" x2="60" y2="256" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="452" y1="256" x2="492" y2="256" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Cyber Eye Geometry -->
  <path d="M 60 256 Q 256 100 452 256 Q 256 412 60 256 Z" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Iris Circle -->
  <circle cx="256" cy="256" r="70" fill="#0c1220" stroke="#00e5ff" stroke-width="8"/>
  <circle cx="256" cy="256" r="30" fill="#00e5ff"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
